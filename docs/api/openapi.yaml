openapi: 3.1.0
info:
  title: ATLAS DataGob API
  version: 0.8.0
  description: >
    Contract-first API for ATLAS DataGob. The API supports governed demand
    intake, Gemini ADK conversational Business Case definition, prioritization,
    portfolio workflows, canonical metadata and controlled synthetic data.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service health status.
  /intake/classify:
    post:
      summary: Classify a business demand into the deterministic legacy initiative taxonomy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandPayload"
      responses:
        "200":
          description: Classification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationResult"
  /intake/policy-architecture-validate:
    post:
      summary: Validate an intake request against policy RAG, canonical architecture and Operative Committee routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyArchitecturePayload"
      responses:
        "200":
          description: Policy, architecture and committee validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyArchitectureValidationResult"
  /intake/conversation:
    post:
      summary: Run one guided Gemini ADK business-intake conversation turn.
      description: >
        Starts or resumes a durable ADK intake session. The conversation may
        invoke Data Readiness, Architecture Validation and Policy & Controls
        specialist agents. This endpoint never creates a formal demand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationalIntakePayload"
      responses:
        "200":
          description: Conversational response plus current structured Business Case state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationalIntakeResponse"
        "502":
          description: Gemini ADK runtime failure.
  /intake/governance-catalog:
    get:
      summary: Return safe readiness metadata for the versioned governance JSON catalog.
      responses:
        "200":
          description: Catalog source, bucket/prefix and active record counts.
  /intake/business-case/document:
    post:
      summary: Download a ready canonical Business Case as a Microsoft Word document.
      description: >
        Generates a DOCX deterministically from the Canonical Business Case already
        materialized in the ADK session. The endpoint does not invoke Gemini, register
        a demand or mutate lifecycle state. Export is available only when Definition
        of Ready is complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCaseDocumentPayload"
      responses:
        "200":
          description: Office Open XML Word document generated from the canonical Business Case.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "404":
          description: Intake session not found.
        "409":
          description: Business Case does not yet meet Definition of Ready.
  /intake/business-case/register:
    post:
      summary: Register a confirmed canonical Business Case as a governed demand.
      description: >
        Requires explicit user confirmation and a session whose Business Case is
        ready to register. Registration uses the existing deterministic validation,
        persistence and lifecycle controls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCaseRegistrationPayload"
      responses:
        "200":
          description: Demand created from the confirmed Business Case.
        "404":
          description: Intake session not found.
        "409":
          description: Confirmation missing or Business Case not ready.
  /synthetic-data/generate:
    post:
      summary: Generate synthetic demand records without deleting existing backlog data.
      description: >
        Creates a new batch of controlled synthetic demands and appends them to
        the configured runtime repository. Existing operational records are
        preserved. Generated records include synthetic provenance metadata and
        a batch identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyntheticDataPayload"
      responses:
        "200":
          description: Synthetic demand batch generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyntheticDataGenerateResponse"
        "400":
          description: Invalid generation request.
  /policies:
    get:
      summary: Return the versioned policy corpus metadata.
      responses:
        "200":
          description: Policy documents available to the legacy local RAG loader.
  /scoring/calculate:
    post:
      summary: Calculate the prioritization score for a demand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoringPayload"
      responses:
        "200":
          description: Score and priority bucket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringResult"
  /metadata/domains:
    get:
      summary: Return the canonical domain and subdomain catalog.
      responses:
        "200":
          description: Data domains and stewardship metadata.
  /metadata/data-dictionary:
    get:
      summary: Return the versioned canonical data dictionary.
      responses:
        "200":
          description: Entities, fields, data types, keys and classification labels.
  /metadata/er-model:
    get:
      summary: Return the canonical entity relationship model.
      responses:
        "200":
          description: Entity relationships and cardinalities.
  /metadata/validate:
    get:
      summary: Validate dictionary, domain catalog and ER model consistency.
      responses:
        "200":
          description: Validation status and errors.
components:
  schemas:
    DemandPayload:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 10
        requester_area:
          type: string
          default: unknown
        requester_role:
          type: string
          default: unknown
        domain_hint:
          type: string
          nullable: true
    PolicyArchitecturePayload:
      allOf:
        - $ref: "#/components/schemas/DemandPayload"
        - type: object
          properties:
            target_consumption:
              type: string
              nullable: true
    ConversationalIntakePayload:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 2
        session_id:
          type: string
          nullable: true
    ConversationalIntakeResponse:
      type: object
      required: [session_id, message, business_case, agent_trace]
      properties:
        session_id:
          type: string
        message:
          type: string
        business_case:
          $ref: "#/components/schemas/CanonicalBusinessCase"
        business_context:
          type: object
        project_classification:
          type: object
        data_readiness:
          type: object
        architecture_assessment:
          type: object
        policy_assessment:
          type: object
        agent_trace:
          type: array
          items:
            type: string
    BusinessCaseDocumentPayload:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          minLength: 5
    BusinessCaseRegistrationPayload:
      type: object
      required: [session_id, confirmed]
      properties:
        session_id:
          type: string
          minLength: 5
        confirmed:
          type: boolean
    CanonicalBusinessCase:
      type: object
      properties:
        business_problem:
          type: string
        desired_outcome:
          type: string
        business_area:
          type: string
        stakeholders:
          type: array
          items:
            type: string
        impacted_process:
          type: string
        current_situation:
          type: string
        success_metrics:
          type: array
          items:
            type: string
        data_sources:
          type: array
          items:
            type: string
        project_classification:
          type: object
        data_readiness:
          type: object
        architecture_assessment:
          type: object
        policy_assessment:
          type: object
        preliminary_risk:
          type: string
        definition_gaps:
          type: array
          items:
            type: string
        governance_requirements:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        recommendation:
          type: string
        completeness:
          type: integer
          minimum: 0
          maximum: 100
        ready_to_register:
          type: boolean
    ClassificationResult:
      type: object
      required: [initiative_type, confidence, rationale, signals]
      properties:
        initiative_type:
          type: string
          enum: [data_engineering, data_governance, machine_learning, agentic_ai, hybrid, unknown]
        confidence:
          type: number
        rationale:
          type: string
        signals:
          type: array
          items:
            type: string
        secondary_types:
          type: array
          items:
            type: string
    PolicyArchitectureValidationResult:
      type: object
      required:
        - structured_request
        - classification
        - architecture
        - policy_matches
        - policy_gaps
        - architecture_gaps
        - operative_committee
        - human_architecture_review_required
        - recommended_next_action
        - committee_summary
      properties:
        structured_request:
          type: object
        classification:
          type: object
        architecture:
          type: object
        policy_matches:
          type: array
          items:
            type: object
        similar_projects:
          type: array
          items:
            type: object
        policy_gaps:
          type: array
          items:
            type: string
        architecture_gaps:
          type: array
          items:
            type: string
        finops_gaps:
          type: array
          items:
            type: string
        operative_committee:
          type: object
        human_architecture_review_required:
          type: boolean
        recommended_next_action:
          type: string
        committee_summary:
          type: string
    SyntheticDataPayload:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        actor:
          type: string
          default: Synthetic Data Operator
    SyntheticDataGenerateResponse:
      type: object
      required: [batch_id, count, total_backlog, demands, message]
      properties:
        batch_id:
          type: string
          description: Unique identifier for the generated synthetic batch.
        count:
          type: integer
          description: Number of synthetic demands generated.
        total_backlog:
          type: integer
          description: Total backlog size after append-only generation.
        demands:
          type: array
          items:
            type: object
        message:
          type: string
    ScoringPayload:
      type: object
      required:
        - business_value
        - strategic_alignment
        - data_readiness
        - technical_feasibility
        - execution_effort
        - risk_control
      properties:
        business_value: {type: integer, minimum: 1, maximum: 5}
        strategic_alignment: {type: integer, minimum: 1, maximum: 5}
        data_readiness: {type: integer, minimum: 1, maximum: 5}
        technical_feasibility: {type: integer, minimum: 1, maximum: 5}
        execution_effort: {type: integer, minimum: 1, maximum: 5}
        risk_control: {type: integer, minimum: 1, maximum: 5}
    ScoringResult:
      type: object
      required: [score, priority, rationale, components]
      properties:
        score:
          type: number
        priority:
          type: string
          enum: [Alta, Media, Backlog, Reformular]
        rationale:
          type: string
        components:
          type: object
