name: Container build

on:
  pull_request:
    branches: [ main ]

jobs:
  api-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t atlas-datagob-api:test .

  web-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t atlas-datagob-web:test apps/web
