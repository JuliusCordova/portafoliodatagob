name: Deploy scripts

on:
  pull_request:
    branches: [ main ]

jobs:
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloud Run deploy scripts
        run: make validate-deploy-scripts
      - name: Validate Cloud Run smoke script
        run: make validate-cloud-smoke-script
      - name: Validate authenticated Cloud Run smoke script
        run: make validate-authenticated-cloud-smoke-script
      - name: Validate pilot evidence collector
        run: make validate-pilot-evidence-script
      - name: Validate production promotion gate
        run: make validate-production-promotion-gate-script
